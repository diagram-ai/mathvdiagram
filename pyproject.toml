[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mathvdiagram"
version = "0.1.0"
description = "A benchmark for evaluating LLMs on precision mathematical diagram generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Harish Kashyap" },
  { name = "Sriram CR" },
  { name = "Sanyukta Tuti" },
  { name = "Aryan Mistry" },
  { name = "Kiran" },
]
keywords = [
  "mathematical-diagrams",
  "benchmark",
  "vision-language-models",
  "diagram-generation",
  "tikz",
  "evaluation-metrics",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base install: the data-curation pipeline (classify -> describe -> aggregate -> report).
# This is everything needed to turn MathVision into the curated prompt set.
dependencies = [
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "python-dotenv>=1.0.0",
  "tqdm>=4.66.0",
  "datasets>=2.18.0",
  "openai>=1.30.0",
  "anthropic>=0.34.0",
  "google-generativeai>=0.7.0",
  "scikit-image>=0.22.0",
  "opencv-python>=4.9.0",
]

[project.optional-dependencies]
# Benchmark half: generation compilers + evaluation metrics + paper figures + HF upload.
benchmark = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "torchmetrics>=1.3.0",
  "piq>=0.8.0",
  "transformers>=4.40.0",
  "cairosvg>=2.7.0",
  "scipy>=1.12.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "sympy>=1.12.0",
  "networkx>=3.2.0",
  "shapely>=2.0.0",
  "huggingface_hub>=0.23.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]
# Convenience: everything.
all = ["mathvdiagram[benchmark,dev]"]

[project.urls]
Repository = "https://github.com/diagram-ai/mathvdiagram"

[project.scripts]
mathvdiagram = "mathvdiagram.pipeline:main"

[tool.setuptools.packages.find]
include = ["mathvdiagram*"]

[tool.setuptools.package-data]
mathvdiagram = ["py.typed"]
